<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Privacy Policy | Merchant Navy Career Guide</title>

    <meta name="description"
          content="Privacy Policy for Merchant Navy Career Guide. Learn how this website handles visitor information, cookies and third-party services.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f8fc;
            color: #172033;
            line-height: 1.7;
        }

        header {
            background: #082b4c;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            background: linear-gradient(135deg, #0b426f, #082b4c);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 45px auto;
        }

        .card {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #082b4c;
            margin-bottom: 12px;
            font-size: 25px;
        }

        .card p {
            margin-bottom: 14px;
        }

        .card ul {
            margin: 10px 0 15px 25px;
        }

        .card li {
            margin-bottom: 8px;
        }

        .notice {
            background: #fff8e6;
            border-left: 5px solid #d99b00;
            padding: 20px;
            border-radius: 8px;
        }

        footer {
            background: #082b4c;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }

        footer p {
            margin: 5px 0;
        }

        @media (max-width: 700px) {

            header {
                justify-content: center;
                text-align: center;
            }

            .logo {
                width: 100%;
            }

            nav {
                justify-content: center;
            }

            .hero h1 {
                font-size: 32px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>
